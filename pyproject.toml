[project]
name = "hearth-ha-integration"
version = "0.1.0"
description = "Hearth AI Home Assistant custom integration (tests + tooling)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.366",  # pins homeassistant==2026.9.3, as scripts/test.sh does
  "pytest-asyncio",
  "hassil",
  "home-assistant-intents",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# A hung test ends the run after a minute, with every thread's stack, and not at CI's job limit
# (#649). `thread` and not the default `signal`: on a real hang the signal method failed the test at
# 60 s and the run then stayed stuck in teardown until it was killed; `thread` dumps the stacks and
# exits the process. The cost is that tests after the hung one do not run. pytest-timeout is pinned by
# pytest-homeassistant-custom-component, so it is always in the venv test.sh builds. The slowest test
# takes a few seconds, so this only ever fires on a hang.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py314"
